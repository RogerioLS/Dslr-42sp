name: 🌐 Deploy Visual Artifacts to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy_pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib seaborn scikit-learn

      - name: Generate Visual Artifacts & Dashboard
        run: |
          mkdir -p public/assets/plots
          mkdir -p public/assets/images
          mkdir -p public/docs

          if [ -f "histogram.py" ]; then
            MPLBACKEND=Agg python3 histogram.py datasets/dataset_train.csv || true
            if [ -f "histogram_grid.png" ]; then
              cp histogram_grid.png public/assets/plots/
            fi
          fi

          if [ -f "scatter_plot.py" ]; then
            MPLBACKEND=Agg python3 scatter_plot.py datasets/dataset_train.csv || true
            if [ -f "scatter_plot.png" ]; then
              cp scatter_plot.png public/assets/plots/
            fi
          fi

          if [ -f "pair_plot.py" ]; then
            MPLBACKEND=Agg python3 pair_plot.py datasets/dataset_train.csv || true
            if [ -f "pair_plot.png" ]; then
              cp pair_plot.png public/assets/plots/
            fi
          fi

          # Backward compatibility alias for /plots/
          ln -s assets/plots public/plots || cp -r public/assets/plots public/plots

          # Create sleek HTML dashboard index
          cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>42 DSLR — Visual Analytics Dashboard</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 2rem; }
              .container { max-width: 1200px; margin: 0 auto; }
              h1 { color: #58a6ff; border-bottom: 1px solid #30363d; padding-bottom: 0.5rem; }
              .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1.5rem; margin-bottom: 2rem; }
              img { max-width: 100%; height: auto; border-radius: 6px; border: 1px solid #30363d; margin-top: 1rem; }
              .badge { display: inline-block; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.85rem; font-weight: bold; background: #238636; color: white; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>🧙‍♂️ 42 DSLR — Visual Analytics & Data Exploration</h1>
              <p>Automated visual deliverables generated by GitHub Actions for 42 São Paulo DSLR evaluation.</p>

              <div class="card">
                <h2>📊 1. Hogwarts Course Score Distributions (Histogram Analysis)</h2>
                <span class="badge">Care of Magical Creatures: Homogeneous Feature</span>
                <p>Score distribution per Hogwarts house across 13 magical subjects.</p>
                <img src="plots/histogram_grid.png" alt="Hogwarts Course Histograms Grid" onerror="this.style.display='none'">
              </div>
            </div>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
