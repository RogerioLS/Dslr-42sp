name: 🚀 Milestone Release & Changelog Bot

on:
  milestone:
    types: [closed]
  workflow_dispatch:
    inputs:
      milestone_number:
        description: 'Milestone number to release (e.g. 1)'
        required: true
        type: string

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  publish-milestone-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Release Bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MILESTONE_NUM: ${{ github.event.milestone.number || inputs.milestone_number }}
        run: |
          python3 scripts/release_bot.py --milestone-number "$MILESTONE_NUM"
