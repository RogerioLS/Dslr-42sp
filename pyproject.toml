[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dslr-42"
version = "1.0.0"
description = "42 São Paulo - Data Science x Logistic Regression (DSLR) Harry Potter Classifier"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Rogerio Silva", email = "rogerio_288@hotmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=2.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "flake8>=7.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "ruff>=0.1.14",
    "pre-commit>=3.6.0",
    "scikit-learn>=1.3.0",
    "pytest>=7.4.0",
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "W", "C90", "I"]
ignore = []

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "tests*", "scripts*"]
